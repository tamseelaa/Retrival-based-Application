services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_pgvector
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_db
    volumes:
      - pgvector_data:/var/lib/postgresql/data

volumes:
  pgvector_data:
